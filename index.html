<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Private browser-local chat with Llama 3.2 1B Instruct." />
    <title>Llama 3.2 1B Web</title>
  </head>
  <body>
    <main class="app">
      <header>
        <div>
          <p class="eyebrow">LOCAL AI</p>
          <h1>Llama 3.2 1B</h1>
          <p class="sub">Runs locally in your browser with WebGPU.</p>
        </div>
        <button id="clear" type="button">Clear</button>
      </header>
      <section id="status" class="status" aria-live="polite">Checking WebGPU…</section>
      <section id="chat" class="chat" aria-live="polite"></section>
      <form id="composer">
        <textarea id="input" rows="2" placeholder="Ask something…" autocomplete="off"></textarea>
        <button id="send" type="submit">Send</button>
      </form>
      <footer>Built with Llama • Llama 3.2 1B Instruct • Runs locally in your browser</footer>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
